apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.example.randomdrive'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.randomdrive"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // A committed debug.keystore (see /app/debug.keystore) instead of the
    // default machine-specific one. Without this, every computer — and
    // every fresh GitHub Actions run — would generate its own random debug
    // key, giving a different SHA-1 each time, which breaks the Maps API
    // key's "Android apps" restriction. This way the SHA-1 is fixed and
    // documented in the README, no local Android tooling required.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
